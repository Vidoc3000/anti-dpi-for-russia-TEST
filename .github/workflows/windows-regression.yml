name: Windows regression tests

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'packaging/windows/**'
      - 'tests/windows/**'
      - '.github/workflows/windows-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'packaging/windows/**'
      - 'tests/windows/**'
      - '.github/workflows/windows-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    name: PowerShell 5.1 parsing and Windows CLI regressions
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify the pinned Windows engine bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Get-Content -LiteralPath '.\windows\payload\Official_Bundle_20261023_public_v1.json' -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP 'zapret-win-bundle.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'zapret-win-bundle'
          Invoke-WebRequest -UseBasicParsing -Uri $meta.url -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne [long]$meta.bytes) { throw 'Pinned Windows bundle size mismatch.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine $meta.sha256) { throw 'Pinned Windows bundle SHA-256 mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack -Force
          $bundle = Join-Path $unpack ('zapret-win-bundle-' + $meta.commit + '\zapret-winws')
          if (-not (Test-Path -LiteralPath (Join-Path $bundle 'winws2.exe') -PathType Leaf)) { throw 'Pinned winws2.exe missing from verified bundle.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, ('IGARECK_WINWS2_DIR=' + $bundle + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))

      - name: Parse scripts and run Windows regression checks
        shell: powershell
        run: |
          try {
              & .\tests\windows\test_regressions.ps1
          } catch {
              Write-Output ('::error title=Windows regression failure::' + $_.Exception.Message)
              Write-Output ('::error title=Windows regression stack::' + $_.ScriptStackTrace)
              exit 1
          }

      - name: Smoke-build and verify the Windows ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = '.\dist\windows-regression'
          & .\packaging\windows\build.ps1 -ZipOnly -Version '1.0' -OutputDirectory $output
          $sums = Join-Path $output 'SHA256SUMS_Windows_ZIP_v1.0.txt'
          foreach ($line in Get-Content -LiteralPath $sums) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid ZIP checksum line.' }
              $expected = $Matches[1]
              $path = Join-Path $output $Matches[2]
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $expected) {
                  throw ('Windows ZIP SHA-256 mismatch: ' + $path)
              }
          }
