name: Build AntiDPI release files
run-name: Build AntiDPI release (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - all
      linux_version:
        description: 'Linux version (must match linux/data/release.json)'
        required: true
        default: '1.30'
        type: string
      windows_version:
        description: 'Windows version (must match the Windows application sources)'
        required: true
        default: '1.30'
        type: string
      publish_release:
        description: 'Publish a combined release (platform=all) or standalone Windows release (platform=windows), from main only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '0'

jobs:
  windows:
    name: Windows x64 ZIP and EXE
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    env:
      AntiDPI_VERSION: ${{ inputs.windows_version }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Windows regression checks
        shell: powershell
        run: |
          try {
              .\tests\windows\test_regressions.ps1
          } catch {
              $details = $_.Exception.Message -replace '[\r\n]+', ' '
              Write-Output "::error title=Windows regression details::$details"
              throw
          }



      - name: Build Windows release files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\windows\AntiDPI_Manager.ps1' -Raw
          if ($source -notmatch "DisplayVersion='(?:GUI \+ CLI|CLI) Version ([0-9.]+)'") { throw 'Windows source version not found.' }
          if ($Matches[1] -ne $env:AntiDPI_VERSION) { throw 'Windows package version does not match the sources.' }
          & .\packaging\windows\build.ps1 -Version $env:AntiDPI_VERSION

      - name: Verify SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sums = Join-Path 'dist' ('SHA256SUMS_Windows_v' + $env:AntiDPI_VERSION + '.txt')
          foreach ($line in Get-Content -LiteralPath $sums) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum line.' }
              $expected = $Matches[1]
              $path = Join-Path 'dist' $Matches[2]
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $expected) {
                  throw ('SHA-256 mismatch: ' + $path)
              }
          }

      - name: Upload Windows build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiDPI-Windows-x64-v${{ inputs.windows_version }}
          path: |
            dist/AntiDPI_CLI_v${{ inputs.windows_version }}_Windows_x64.zip
            dist/AntiDPI_CLI_v${{ inputs.windows_version }}_Windows_x64.exe
            dist/SHA256SUMS_Windows_v${{ inputs.windows_version }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x64 tar.gz
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    env:
      AntiDPI_VERSION: ${{ inputs.linux_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Linux regression checks
        run: python3 -m unittest discover -s tests/linux -v

      - name: Install native validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libnetfilter-queue-dev libnfnetlink-dev libmnl-dev zlib1g-dev libcap-dev libluajit-5.1-dev

      - name: Build pinned engine and validate every strategy
        run: python3 tests/linux/check_compatible_engine.py

      - name: Build Linux release files
        shell: bash
        run: bash packaging/linux/build.sh --version "$AntiDPI_VERSION"

      - name: Verify SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum -c "SHA256SUMS_Linux_v${AntiDPI_VERSION}.txt"

      - name: Upload Linux build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiDPI-Linux-x64-v${{ inputs.linux_version }}
          path: |
            dist/AntiDPI_CLI_v${{ inputs.linux_version }}_Linux_x64.tar.gz
            dist/SHA256SUMS_Linux_v${{ inputs.linux_version }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: >-
      always() && !cancelled() && inputs.publish_release &&
      github.ref == 'refs/heads/main' && needs.windows.result == 'success' &&
      (inputs.platform == 'windows' || (inputs.platform == 'all' && needs.linux.result == 'success'))
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-artifacts

      - name: Attest combined release packages
        if: inputs.platform == 'all'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*.tar.gz

      - name: Attest standalone Windows packages
        if: inputs.platform == 'windows'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe

      - name: Verify release package attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' \) -print0 | sort -z)
          expected_packages=3
          if [[ '${{ inputs.platform }}' == 'windows' ]]; then expected_packages=2; fi
          if [[ ${#packages[@]} -ne $expected_packages ]]; then
            printf 'Expected %s attested release packages; found %s.\n' "$expected_packages" "${#packages[@]}" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            gh attestation verify "$package" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done

      - name: Create release with verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.linux_version }}
          RELEASE_TITLE: AntiDPI GUI + CLI — Windows v${{ inputs.windows_version }} / Linux v${{ inputs.linux_version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' -o -name 'SHA256SUMS_*.txt' \) | sort)
          expected_assets=5
          if [[ '${{ inputs.platform }}' == 'windows' ]]; then expected_assets=3; fi
          if [[ ${#assets[@]} -ne $expected_assets ]]; then
            printf 'Expected %s verified release assets; found %s.\n' "$expected_assets" "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          if [[ '${{ inputs.platform }}' == 'windows' ]]; then
            RELEASE_TAG="windows-v${{ inputs.windows_version }}"
            RELEASE_TITLE="AntiDPI GUI + CLI — Windows v${{ inputs.windows_version }}"
            cat > release-notes.md <<EOF
          AntiDPI standalone Windows release v${{ inputs.windows_version }}.

          - Windows 10/11 x64 GUI + CLI ZIP and EXE, with SHA-256 sums and GitHub build provenance attestations.
          - Comparative strategy analysis runs five trials in a shuffled order with controls before and after the series. Results include median and range of successful response times, success-rate percentage, a 95% Wilson interval, and the percentage-point change against the control.
          - Five trials are still a limited sample. Results are indicative, do not prove DPI bypass, and never select or apply a strategy automatically.
          - This is a Windows-only release. It is intentionally not marked Latest so the combined v${{ inputs.linux_version }} release remains the latest target for the Linux updater.

          Copyright, license notices, and the original author's attribution remain included.
          EOF
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_TITLE" \
              -f body="$(cat release-notes.md)" \
              -f make_latest=false >/dev/null
            gh release upload "$RELEASE_TAG" "${assets[@]}"
          else
            cat > release-notes.md <<EOF
          AntiDPI combined release v${{ inputs.linux_version }}.

          - Linux CLI package: v${{ inputs.linux_version }} (Ubuntu/Debian x64), with the current strategy catalogue.
          - Windows GUI + CLI package: v${{ inputs.windows_version }} (Windows 10/11 x64).
          - Windows adds repeatable HTTPS/HTTP/3 checks, separate web/video targets, explicit VPN-interface and Tor SOCKS checks, and before/after control measurements for strategy comparisons.
          - Windows update wizard now displays the full replacement-file list and waits for explicit approval before updating.
          - GUI stop uses the managed shutdown signal and no longer shows the console-only Ctrl+C hint; both window and tray use the shortcut icon.
          - Windows also adds network-change debounce, preflight readiness, graceful recovery prompting after GUI restart, release diff/digest inspection, and a replacement-file preview before updates.
          - Windows connectivity matrix passes the selected target fields as evaluated values and safely detaches completed background jobs before showing modal results.
          - Probe results report reachability only: they do not prove DPI bypass or video playback; VPN route binding is not a privacy/leak audit, and GitHub API digests are not independent signatures.
          - Linux CLI adds read-only doctor diagnostics (including JSON output), saved network profiles, run history, and `update --check` to verify checksums, GitHub provenance attestations, and archive structure without installing.
          - ZIP, EXE, and TAR.GZ assets are accompanied by SHA-256 checksum files and GitHub artifact attestations. The Linux updater verifies the attestation against this repository's release workflow before installing; downloaded packages can also be checked with `gh attestation verify <file> --repo Vidoc3000/anti-dpi-for-russia-TEST`.

          Copyright, license notices, and the original author's attribution remain included.
          EOF
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          fi
