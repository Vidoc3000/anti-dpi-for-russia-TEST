name: Build AntiDPI release files
run-name: Build AntiDPI release (${{ inputs.platform }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - all
      linux_version:
        description: 'Linux version (must match linux/data/release.json)'
        required: true
        default: '1.13'
        type: string
      windows_version:
        description: 'Windows version (must match the Windows application sources)'
        required: true
        default: '1.12'
        type: string
      publish_release:
        description: 'Publish a GitHub release (requires platform=all and ref=main)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '0'

jobs:
  windows:
    name: Windows x64 ZIP and EXE
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    env:
      AntiDPI_VERSION: ${{ inputs.windows_version }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Windows regression checks
        shell: powershell
        run: |
          try {
              .\tests\windows\test_regressions.ps1
          } catch {
              $details = $_.Exception.Message -replace '[\r\n]+', ' '
              Write-Output "::error title=Windows regression details::$details"
              throw
          }



      - name: Build Windows release files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath '.\windows\AntiDPI_Manager.ps1' -Raw
          if ($source -notmatch "DisplayVersion='(?:GUI \+ CLI|CLI) Version ([0-9.]+)'") { throw 'Windows source version not found.' }
          if ($Matches[1] -ne $env:AntiDPI_VERSION) { throw 'Windows package version does not match the sources.' }
          & .\packaging\windows\build.ps1 -Version $env:AntiDPI_VERSION

      - name: Verify SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sums = Join-Path 'dist' ('SHA256SUMS_Windows_v' + $env:AntiDPI_VERSION + '.txt')
          foreach ($line in Get-Content -LiteralPath $sums) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid checksum line.' }
              $expected = $Matches[1]
              $path = Join-Path 'dist' $Matches[2]
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ine $expected) {
                  throw ('SHA-256 mismatch: ' + $path)
              }
          }

      - name: Upload Windows build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiDPI-Windows-x64-v${{ inputs.windows_version }}
          path: |
            dist/AntiDPI_CLI_v${{ inputs.windows_version }}_Windows_x64.zip
            dist/AntiDPI_CLI_v${{ inputs.windows_version }}_Windows_x64.exe
            dist/SHA256SUMS_Windows_v${{ inputs.windows_version }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux:
    name: Linux x64 tar.gz
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    env:
      AntiDPI_VERSION: ${{ inputs.linux_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out selected source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Linux regression checks
        run: python3 -m unittest discover -s tests/linux -v

      - name: Install native validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libnetfilter-queue-dev libnfnetlink-dev libmnl-dev zlib1g-dev libcap-dev libluajit-5.1-dev

      - name: Build pinned engine and validate every strategy
        run: python3 tests/linux/check_compatible_engine.py

      - name: Build Linux release files
        shell: bash
        run: bash packaging/linux/build.sh --version "$AntiDPI_VERSION"

      - name: Verify SHA-256
        shell: bash
        run: |
          cd dist
          sha256sum -c "SHA256SUMS_Linux_v${AntiDPI_VERSION}.txt"

      - name: Upload Linux build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AntiDPI-Linux-x64-v${{ inputs.linux_version }}
          path: |
            dist/AntiDPI_CLI_v${{ inputs.linux_version }}_Linux_x64.tar.gz
            dist/SHA256SUMS_Linux_v${{ inputs.linux_version }}.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub release
    if: inputs.publish_release && inputs.platform == 'all' && github.ref == 'refs/heads/main'
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir release-artifacts

      - name: Create release with verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.linux_version }}
          RELEASE_TITLE: AntiDPI GUI + CLI — Windows v${{ inputs.windows_version }} / Linux v${{ inputs.linux_version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.exe' -o -name '*.tar.gz' -o -name 'SHA256SUMS_*.txt' \) | sort)
          if [[ ${#assets[@]} -ne 5 ]]; then
            printf 'Expected five verified release assets; found %s.\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          AntiDPI combined release v${{ inputs.linux_version }}.

          - Linux CLI package: v${{ inputs.linux_version }} (Ubuntu/Debian x64).
          - Windows GUI + CLI package: v${{ inputs.windows_version }} (Windows 10/11 x64).
          - Windows GUI + CLI v${{ inputs.windows_version }} presents a more compact, resizable interface with fewer forced scrollbars, and clearer verified installation results instead of alarming false-error feedback; it retains the existing analysis export and recovery safeguards.
          - Linux CLI v${{ inputs.linux_version }} carries the unchanged application source and current strategy catalogue; only its package version advances for this combined release.
          - YouTube analysis checks only IPv4/TCP/TLS HTTPS access; it does not validate VPN/Tor clients or tunnels or prove DPI bypass.
          - ZIP, EXE, and TAR.GZ assets are accompanied by SHA-256 checksum files.

          Copyright, license notices, and the original author's attribution remain included.
          EOF
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
