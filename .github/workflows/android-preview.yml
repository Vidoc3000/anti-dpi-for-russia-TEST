name: Android preview build

on:
  push:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/android/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft Android release tag to attach this build to (leave empty for CI only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  ANDROID_PREVIEW_VERSION: '0.4.7-preview'

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/arena/') ||
      startsWith(github.ref, 'refs/tags/android-v')
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Android project checks
        run: python3 -m unittest discover -s tests/android -v

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: android/engine/go.mod
          cache-dependency-path: android/engine/go.sum

      - name: Test Android packet engine
        working-directory: android/engine
        run: go test ./...

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -d "$ANDROID_HOME/ndk/27.3.13750724"

      - name: Build native Android engine AAR
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
          ./android/engine/build-aar.sh
          test -s android/app/libs/antidpi-engine.aar

      - name: Build preview APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug > "$RUNNER_TEMP/gradle-build.log" 2>&1
          result=$?
          if [[ $result -ne 0 ]]; then
            grep -E 'error:|What went wrong|Execution failed|Could not|FAILURE:|Failed to|failed to' "$RUNNER_TEMP/gradle-build.log" | tail -n 30 | while IFS= read -r line; do
              echo "::error title=Gradle build diagnostic::$line"
            done
            tail -n 40 "$RUNNER_TEMP/gradle-build.log"
          fi
          exit "$result"

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/AntiDPI-Android-v${ANDROID_PREVIEW_VERSION}.apk"
          cd dist
          sha256sum "AntiDPI-Android-v${ANDROID_PREVIEW_VERSION}.apk" > "SHA256SUMS_Android_v${ANDROID_PREVIEW_VERSION}.txt"

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AntiDPI-Android-v${{ env.ANDROID_PREVIEW_VERSION }}
          path: |
            dist/AntiDPI-Android-v${{ env.ANDROID_PREVIEW_VERSION }}.apk
            dist/SHA256SUMS_Android_v${{ env.ANDROID_PREVIEW_VERSION }}.txt
          if-no-files-found: error
          retention-days: 14

  attach-release-assets:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    name: Attach APK to draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AntiDPI-Android-v${{ env.ANDROID_PREVIEW_VERSION }}
          path: release-assets

      - name: Attach APK and checksum to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" | \
            jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' | head -n 1)
          if [[ -z "$release_id" ]]; then
            echo "No draft release found for tag $RELEASE_TAG" >&2
            exit 1
          fi
          for asset in release-assets/*; do
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$(basename "$asset")"
          done
