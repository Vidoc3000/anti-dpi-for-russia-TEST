name: Android preview build

on:
  push:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/android/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/arena/') ||
      startsWith(github.ref, 'refs/tags/android-v')
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Android project checks
        run: python3 -m unittest discover -s tests/android -v

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build preview APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AntiDPI-Android-v0.1.0-preview.apk
          cd dist
          sha256sum AntiDPI-Android-v0.1.0-preview.apk > SHA256SUMS_Android_v0.1.0-preview.txt

      - name: Upload preview APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AntiDPI-Android-v0.1.0-preview
          path: |
            dist/AntiDPI-Android-v0.1.0-preview.apk
            dist/SHA256SUMS_Android_v0.1.0-preview.txt
          if-no-files-found: error
          retention-days: 14

  attach-release-assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    name: Attach APK to draft GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AntiDPI-Android-v0.1.0-preview
          path: release-assets

      - name: Attach APK and checksum to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
